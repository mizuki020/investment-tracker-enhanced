name: Market data foundation checks
on:
  push:
    branches: [feature/stock-analysis-skill-v1]
    paths:
      - 'market_data/**'
      - 'tests/test_*.py'
      - 'requirements-test-signatures.txt'
      - '.github/workflows/market-data-check.yml'
  pull_request:
    paths:
      - 'market_data/**'
      - 'tests/test_*.py'
      - 'requirements-test-signatures.txt'
      - '.github/workflows/market-data-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-market-data-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned test-only crypto dependencies
        run: python -m pip install --only-binary=:all: -r requirements-test-signatures.txt
      - name: Run audited offline suite with network connections denied
        run: |
          python -B - <<'PY'
          import socket
          import unittest
          from unittest.mock import patch
          with patch.object(socket, 'socket', side_effect=AssertionError('offline tests: network prohibited')):
              suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
              result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          PY
