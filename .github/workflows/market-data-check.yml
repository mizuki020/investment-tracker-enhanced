name: Market data foundation checks
on:
  push:
    branches: [feature/stock-analysis-skill-v1]
    paths:
      - 'market_data/**'
      - 'tests/test_market_data_indicators.py'
      - '.github/workflows/market-data-check.yml'
  pull_request:
    paths:
      - 'market_data/**'
      - 'tests/test_market_data_indicators.py'
      - '.github/workflows/market-data-check.yml'
  workflow_dispatch:

jobs:
  offline-indicator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run OHLCV and indicator unit tests
        run: python -m unittest discover -s tests -p 'test_market_data_indicators.py' -v
